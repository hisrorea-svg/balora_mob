name: balora_mob
description: "Balora Mobile Companion — High-performance mobile client for Balora Desktop."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State Management ---
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # --- Routing ---
  go_router: ^14.8.1

  # --- Database (Offline Queue & Cache) ---
  drift: ^2.25.0
  sqlite3_flutter_libs: ^0.5.32

  # --- Networking ---
  dio: ^5.8.0+1
  web_socket_channel: ^3.0.2

  # --- Data Models ---
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0

  # --- Scanner ---
  mobile_scanner: ^7.4.2

  # --- Utilities ---
  uuid: ^4.5.1
  connectivity_plus: ^6.1.4
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  logger: ^2.5.0

  # --- UI Enhancements ---
  flutter_animate: ^4.5.2
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.6
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # --- Code Generation ---
  build_runner: ^2.4.15
  riverpod_generator: ^4.0.9
  freezed: ^4.0.2
  json_serializable: ^6.9.4
  drift_dev: ^2.25.0

  # --- Linting ---
  flutter_lints: ^6.0.0
  riverpod_lint: ^3.1.9
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/drug_assest/
